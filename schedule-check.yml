name: Check scheduler

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/schedule-check.yml
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Show trigger and time
        env:
          TRIGGER: ${{ github.event_name }}
        run: |
          echo "Trigger=$TRIGGER"
          date -u
